{% extends "admin/change_form.html" %}
{% load i18n admin_urls static admin_modify %}

{% block submit_buttons_bottom %}
<div class="submit-row">
    {% if show_save %}<input type="submit" value="{% translate 'Save' %}" class="default" name="_save">{% endif %}
    {% if show_save_and_continue %}<input type="submit" value="{% translate 'Save and continue editing' %}" name="_continue">{% endif %}
    <input type="submit" value="🔄 Reset to Default Colors" name="_reset_to_default" 
           style="background-color: #ff4444; color: white; font-weight: bold; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer;"
           onclick="return confirm('Are you sure you want to reset all colors to default values? This will overwrite all your custom colors.');">
</div>
{% endblock %}
