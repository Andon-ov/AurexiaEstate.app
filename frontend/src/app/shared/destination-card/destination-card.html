<a [routerLink]="destinationLink" class="destination-card">
  <div class="destination-card__image-wrapper">
    <img [src]="destination.thumbnail_image" [alt]="name" class="destination-card__image" loading="lazy" />
    <div class="destination-card__overlay">
      <h3 class="destination-card__name">{{ name }}</h3>
    </div>
  </div>
</a>
