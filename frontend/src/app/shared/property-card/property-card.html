<a [routerLink]="propertyLink" class="property-card">
  <div class="property-card__image-wrapper">
    <img [src]="property.featured_image" [alt]="title" class="property-card__image" loading="lazy" />
    <div class="property-card__overlay">
      <div class="property-card__content">
        <h3 class="property-card__title">{{ title }}</h3>
        <p class="property-card__price">{{ property.formatted_price }}</p>
      </div>
    </div>
  </div>
</a>
