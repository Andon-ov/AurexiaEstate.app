<section class="contactUs-white-section" *ngIf="cta">
    <div class="contactUs-white-content fade-in-up">
        <h3 class="contactUs-white-title">
            {{ cta.title }}
        </h3>

        <a class="main-button" [routerLink]="cta.buttonLink" (click)="navigateToContact()">
            {{ cta.buttonText }}
        </a>
    </div>
</section>
