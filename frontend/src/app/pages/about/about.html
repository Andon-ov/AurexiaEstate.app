<!-- Start : About us hero area -->
<section class="aboutUs-hero">
    <!-- Loading Skeleton for Hero -->
    <div *ngIf="isLoading" class="skeleton-hero-title"></div>
    
    <!-- Actual Hero Title -->
    <h1 *ngIf="!isLoading" class="title fade-in">{{ aboutHero?.heroTitle }}</h1>
    
    <div class="hero-overlay"></div>
</section>
<!-- End : About us hero area-->

<section class="aboutUs-content">
    <!-- Loading Skeleton for Content -->
    <div *ngIf="isLoading" class="aboutUs-text">
        <div class="skeleton-paragraph"></div>
        <br>
        <div class="skeleton-paragraph"></div>
        <br>
        <div class="skeleton-paragraph short"></div>
    </div>

    <!-- Actual Content -->
    <div *ngIf="!isLoading" class="aboutUs-text">
        <p class="paragraph paragraph-1 fade-in">
            {{ aboutHero?.paragraph1 }}
        </p>
        <br>

        <p class="paragraph paragraph-2 fade-in">
            {{ aboutHero?.paragraph2 }}
        </p>
        <br>
        <p class="paragraph paragraph-3 fade-in">
            {{ aboutHero?.paragraph3 }}
        </p>
    </div>

    <div class="achievements-section" id="achievements">
        <!-- Loading Skeleton for Achievements Header -->
        <div *ngIf="isLoadingAchievements">
            <div class="skeleton-title"></div>
            <div class="skeleton-subtitle"></div>
        </div>
        
        <!-- Achievements Header -->
        <h2 *ngIf="!isLoadingAchievements" class="section-title fade-in">{{ achievementsHeader?.title }}</h2>
        <p *ngIf="!isLoadingAchievements" class="section-subtitle fade-in">{{ achievementsHeader?.subtitle }}</p>
        
        <!-- Achievement Cards from API -->
        <div class="achievements-container" *ngIf="achievements.length > 0">
            <div class="achievement-item fade-in-up" *ngFor="let achievement of achievements; let i = index"
                 [style.animation-delay.ms]="i * 100">
                <h5 class="achievement-title">{{ achievement.title }}</h5>
                <hr class="achievement-line" />
                <p class="achievement-count">{{ achievement.count }}</p>
            </div>
        </div>
    </div>


</section>
<app-about-us-image></app-about-us-image>

<app-cta></app-cta>
