<!-- Start : Contact us hero area -->
<section class="contactUs-hero">
  <h1 class="title fade-in" *ngIf="!isLoading && contactContent">{{ contactContent.heroTitle }}</h1>
  <div class="skeleton skeleton-title" *ngIf="isLoading"></div>
  <div class="hero-overlay"></div>
</section>
<!-- End : Contact us hero area-->

<!-- Start :Contact form area -->
<section class="contactUs">
  <div class="contact-info">
    <div class="info">

      <!-- Loading State -->
      <div *ngIf="isLoading">
        <div class="skeleton skeleton-text skeleton-title"></div>
        <div class="skeleton skeleton-text skeleton-subtitle"></div>
        <div class="skeleton skeleton-text"></div>
        <div class="skeleton skeleton-text"></div>
      </div>

      <!-- Content -->
      <div *ngIf="!isLoading && contactContent" class="fade-in-left">
        <h2 class="title">{{ contactContent.title }}</h2>
        <h3 class="subtitle">{{ contactContent.subtitle }}</h3>

        <div class="moreInfo">
          <div class="infoWrapper address">
            <i class="fas fa-map-marker-alt"></i>
            <div class="info-content">
              <p>{{ contactContent.addressLine1 }}</p>
              <p>{{ contactContent.addressLine2 }}</p>
            </div>
          </div>

          <div class="infoWrapper email">
            <i class="fas fa-envelope"></i>
            <div class="info-content">
              <a href="mailto:{{ contactContent.email }}">{{ contactContent.email }}</a>
            </div>
          </div>
        </div>
      </div>

      <!-- Google Maps Embed -->
      <div class="map-container">
        <iframe src="https://www.google.com/maps?q=42.6470734764136,23.400812131158542&hl=bg&z=16&output=embed"
          width="100%" height="220" style="border:0;" allowfullscreen="" loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          aria-label="Карта на адреса Druzhba 2, Tsarigradski Complex, Sofia">
        </iframe>

      </div>
    </div>
    <!-- make component contact-form.ts -->
    <app-contact-form class="form"></app-contact-form>
  </div>
</section>
